name: ci
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: bash syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: python syntax
        run: python -m compileall -q scripts
  r-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: R parse (if available)
        run: |
          if command -v Rscript >/dev/null 2>&1; then
            Rscript -e 'invisible(parse("scripts/08_scdblfinder.R"))' && echo "R parse ok"
          else
            echo "Rscript not installed on runner; skipping"
          fi
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: leak scan (machine paths / credentials)
        run: |
          if git grep -nIE 'C:/Users/|/home/[a-z]|K:/|sk-[A-Za-z0-9]{16,}|ghp_|github_pat_' -- . ':!.git' ':!.github' ':!CONTRIBUTING.md'; then
            echo "::error::疑似机器路径或凭据残留"; exit 1
          fi
      - name: crlf scan
        run: |
          if git grep -lI $'\r' -- . ':!.git' ':!.github' ':!CONTRIBUTING.md'; then
            echo "::error::发现 CRLF 行尾"; exit 1
          fi
      - name: bom scan
        run: |
          if grep -rlI $'^\xEF\xBB\xBF' --exclude-dir=.git . ; then
            echo "::error::发现 UTF-8 BOM"; exit 1
          fi
